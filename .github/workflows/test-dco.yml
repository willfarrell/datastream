name: Tests (dco)

on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  dco:
    name: Tests (dco)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: block
          disable-sudo: true
          disable-telemetry: true
          allowed-endpoints: >
            api.github.com:443
      # allowed-endpoints: >
      #   api.github.com:443
      - name: Check for Developer Certificate of Origin (DCO) compliance
        uses: KineticCafe/actions-dco@a52e56727ec21d6cdba26513826e1ae4a752d2fc # v3.2.1

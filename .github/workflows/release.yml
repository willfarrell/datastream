name: Release

on:
  pull_request:
    types: [closed]
    branches: [main]
    paths:
      - 'package.json'

env:
  NODE_VERSION: 26.x

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build
    if: ${{ github.event.pull_request.merged }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # No id-token/attestations here: this job runs npm run build (dev-dependency
    # code); OIDC-capable permissions live in the attest job, which only handles
    # the packed tarballs.
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: block
          disable-sudo: true
          disable-telemetry: true
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            nodejs.org:443
            objects.githubusercontent.com:443
            registry.npmjs.org:443
            release-assets.githubusercontent.com:443
      # allowed-endpoints: >
      #   github.com:443
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # allowed-endpoints: >
      #   api.github.com:443
      #   nodejs.org:443
      #   objects.githubusercontent.com:443
      #   registry.npmjs.org:443
      #   release-assets.githubusercontent.com:443
      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: https://registry.npmjs.org
          package-manager-cache: false # release artifacts must never touch the shared Actions cache
      # allowed-endpoints: >
      #   registry.npmjs.org:443
      - name: Set env
        run: |
          tag=$(npm pkg get version | xargs)
          echo "tag=${tag}" >> "$GITHUB_ENV"
          echo "prerelease=$([ "${tag##*-*}" ] && echo false || echo true)" >> "$GITHUB_ENV"
      # allowed-endpoints: >
      #   registry.npmjs.org:443
      - name: Install dependencies
        run: |
          npm ci --ignore-scripts
      # allowed-endpoints: >
      #   registry.npmjs.org:443
      - name: Verify dependency signatures
        run: |
          npm audit signatures
      # allowed-endpoints: >
      #   registry.npmjs.org:443
      - name: Build
        run: |
          npm run build --if-present
      # allowed-endpoints: >
      #   registry.npmjs.org:443
      - name: Pack
        id: pack
        run: |
          # npm always ships a package-root LICENSE; the license text lives once at the repo root.
          for dir in packages/*/; do
            cp LICENSE "$dir"
          done
          mapfile -t args < <(npm query '.workspace:not([private])' | jq -r '.[] | "--workspace", .location')
          {
            echo "packages<<EOF"
            npm pack "${args[@]}" --json
            echo EOF
          } >> "$GITHUB_OUTPUT"
      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ env.tag }}
          path: |
            package.json
            packages/*/package.json
            *.tgz
    outputs:
      tag: ${{ env.tag }}
      prerelease: ${{ env.prerelease }}

  attest:
    name: Attest
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: read
      id-token: write # actions/attest-build-provenance
      attestations: write # actions/attest-build-provenance
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: block
          disable-sudo: true
          disable-telemetry: true
          allowed-endpoints: >
            api.github.com:443
            fulcio.sigstore.dev:443
            rekor.sigstore.dev:443
            tuf-repo-cdn.sigstore.dev:443
      - name: Download artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.build.outputs.tag }}
      # allowed-endpoints: >
      #   api.github.com:443
      #   fulcio.sigstore.dev:443
      #   rekor.sigstore.dev:443
      #   tuf-repo-cdn.sigstore.dev:443
      - name: Build Attestations
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            *.tgz

  release:
    name: Release
    needs: [build, attest]
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: write # softprops/action-gh-release
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: block
          disable-sudo: true
          disable-telemetry: true
          allowed-endpoints: >
            api.github.com:443
            uploads.github.com:443
      - name: Download artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.build.outputs.tag }}
      # allowed-endpoints: >
      #   api.github.com:443
      #   uploads.github.com:443
      - name: Release
        # Replaces actions/create-release & actions/upload-release-asset (deprecated)
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2 # zizmor: ignore[superfluous-actions] prefer maintained action over inline `gh release` script
        with:
          draft: true
          prerelease: ${{ needs.build.outputs.prerelease }}
          tag_name: ${{ needs.build.outputs.tag }}
          generate_release_notes: true
          # Disabled, covered by GitHub Attestations & npm
          #files: |
          #  **/*.tgz
    outputs:
      tag: ${{ needs.build.outputs.tag }}
      prerelease: ${{ needs.build.outputs.prerelease }}

  publish:
    name: Publish
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 20

    environment: npm-publish

    permissions:
      contents: read
      id-token: write # npm publish
      attestations: read # gh attestation verify
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: block
          disable-sudo: true
          disable-telemetry: true
          allowed-endpoints: >
            api.github.com:443
            fulcio.sigstore.dev:443
            nodejs.org:443
            objects.githubusercontent.com:443
            registry.npmjs.org:443
            rekor.sigstore.dev:443
            release-assets.githubusercontent.com:443
            tmaproduction.blob.core.windows.net:443
            tuf-repo-cdn.sigstore.dev:443
            tuf-repo.github.com:443
      # allowed-endpoints: >
      #   api.github.com:443
      #   nodejs.org:443
      #   objects.githubusercontent.com:443
      #   registry.npmjs.org:443
      #   release-assets.githubusercontent.com:443
      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: https://registry.npmjs.org
          package-manager-cache: false # release artifacts must never touch the shared Actions cache
      - name: Download artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.release.outputs.tag }}
      # allowed-endpoints: >
      #   api.github.com:443
      #   tmaproduction.blob.core.windows.net:443
      #   tuf-repo-cdn.sigstore.dev:443
      #   tuf-repo.github.com:443
      - name: Verify build provenance attestation
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # A loop, not find -exec: find exits 0 even when the command fails.
          shopt -s nullglob
          tarballs=(./*.tgz)
          if [ "${#tarballs[@]}" -eq 0 ]; then
            echo "::error::No tarballs in the release artifact"
            exit 1
          fi
          for tarball in "${tarballs[@]}"; do
            gh attestation verify "$tarball" --repo "$GITHUB_REPOSITORY"
          done
      # allowed-endpoints: >
      #   api.github.com:443
      #   fulcio.sigstore.dev:443
      #   registry.npmjs.org:443
      #   rekor.sigstore.dev:443
      #   tuf-repo-cdn.sigstore.dev:443
      - name: npm stage publish
        env:
          DIST_TAG: ${{ needs.release.outputs.prerelease == 'true' && 'next' || 'latest' }}
        run: |
          # Brand-new packages (e.g. @datastream/sqlite, @datastream/avro) can't be
          # published from here the first time: npm trusted publishing (OIDC) can only
          # be configured on a package that already exists. Bootstrap each one with a
          # manual `npm publish` from a maintainer, add this workflow as its trusted
          # publisher on npmjs.com, then re-run this job. Until then its publish fails
          # and the step fails after trying the rest; nothing is skipped silently.
          shopt -s nullglob
          tarballs=(./*.tgz)
          if [ "${#tarballs[@]}" -eq 0 ]; then
            echo "::error::No tarballs in the release artifact"
            exit 1
          fi
          failed=()
          for tarball in "${tarballs[@]}"; do
            npm stage publish --tag "$DIST_TAG" --provenance --access public --ignore-scripts "$tarball" || failed+=("$tarball")
          done
          if [ "${#failed[@]}" -gt 0 ]; then
            echo "::error::npm stage publish failed for: ${failed[*]}"
            exit 1
          fi

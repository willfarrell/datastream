---
version: 2
updates:
  - package-ecosystem: "github-actions"
    target-branch: develop
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 14
    groups:
      everything:
        patterns:
          - "*"
  - package-ecosystem: npm
    target-branch: develop
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 14
  - package-ecosystem: docker
    target-branch: develop
    directory: "/.github/docker/semgrep"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 14

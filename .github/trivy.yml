# Trivy license policy: open source licenses pass, everything else fails.
# Every Trivy license scan in this repo loads it (`--config` or trivy-action `trivy-config`).
# Not auto-loaded (only ./trivy.yaml is), so vulnerability scans keep their own severity.
# A license missing from every list is UNKNOWN and fails; add new open licenses below.
# https://trivy.dev/latest/docs/scanner/license/
# https://trivy.dev/latest/docs/references/configuration/config-file/
scan:
  scanners:
    - license
# Open licenses map to LOW, MEDIUM or HIGH and are filtered out here.
severity:
  - UNKNOWN
  - CRITICAL
exit-code: 1
license:
  # Not open source: proprietary, non-commercial, no-derivatives, source-available.
  forbidden:
    - BCL
    - BUSL-1.1
    - Commons-Clause
    - CPOL-1.02
    - Elastic-2.0
    - Facebook-2-Clause
    - Facebook-3-Clause
    - Facebook-Examples
    - Hippocratic-2.1
    - JSON
    - MS-LPL
    - PolyForm-Noncommercial-1.0.0
    - PolyForm-Small-Business-1.0.0
    - SSPL-1.0
    - UNLICENSED
    - CC-BY-NC-1.0
    - CC-BY-NC-2.0
    - CC-BY-NC-2.5
    - CC-BY-NC-3.0
    - CC-BY-NC-4.0
    - CC-BY-NC-ND-1.0
    - CC-BY-NC-ND-2.0
    - CC-BY-NC-ND-2.5
    - CC-BY-NC-ND-3.0
    - CC-BY-NC-ND-4.0
    - CC-BY-NC-SA-1.0
    - CC-BY-NC-SA-2.0
    - CC-BY-NC-SA-2.5
    - CC-BY-NC-SA-3.0
    - CC-BY-NC-SA-4.0
    - CC-BY-ND-1.0
    - CC-BY-ND-2.0
    - CC-BY-ND-2.5
    - CC-BY-ND-3.0
    - CC-BY-ND-4.0
  # Open, strong copyleft.
  restricted:
    - AGPL-1.0
    - AGPL-3.0
    - CC-BY-SA-1.0
    - CC-BY-SA-2.0
    - CC-BY-SA-2.5
    - CC-BY-SA-3.0
    - CC-BY-SA-4.0
    - CECILL-2.1
    - CPAL-1.0
    - EUPL-1.1
    - EUPL-1.2
    - GPL-1.0
    - GPL-2.0
    - GPL-2.0-with-autoconf-exception
    - GPL-2.0-with-bison-exception
    - GPL-2.0-with-classpath-exception
    - GPL-2.0-with-font-exception
    - GPL-2.0-with-GCC-exception
    - GPL-3.0
    - GPL-3.0-with-autoconf-exception
    - GPL-3.0-with-GCC-exception
    - NPL-1.0
